<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDD Jarvis</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --idle-color:      #4a4a6a;
    --listen-color:    #00d4ff;
    --think-color:     #a855f7;
    --speak-color:     #f59e0b;
    --bg:              #06060f;
    --surface:         rgba(255,255,255,0.04);
    --border:          rgba(255,255,255,0.08);
    --text:            #e8e8f0;
    --text-dim:        #6b6b8a;
    --font:            'Outfit', sans-serif;
    --mono:            'JetBrains Mono', monospace;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
  }

  /* ── Grid layout ── */
  .layout {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    padding: 2rem;
    gap: 1.5rem;
    max-width: 900px;
    margin: 0 auto;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
  }
  .logo { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.15em; color: var(--text-dim); }
  .logo span { color: var(--speak-color); }
  .status-pill {
    font-family: var(--mono);
    font-size: 0.7rem;
    padding: 0.3rem 0.8rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    transition: all 0.4s ease;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* ── Center orb area ── */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    position: relative;
  }

  /* Orb container */
  .orb-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Outer glow rings */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid currentColor;
    opacity: 0;
    animation: none;
  }
  .ring-1 { width: 220px; height: 220px; }
  .ring-2 { width: 260px; height: 260px; }
  .ring-3 { width: 300px; height: 300px; }

  /* Core orb */
  .orb {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #2a2a4a, #0d0d1e);
    box-shadow:
      0 0 40px rgba(74,74,106,0.3),
      inset 0 0 30px rgba(0,0,0,0.5);
    transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
  }

  /* Orb inner shimmer */
  .orb::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0%, currentColor 20%, transparent 40%);
    opacity: 0;
    transition: opacity 0.4s;
  }

  /* ── State: IDLE ── */
  body.idle .orb {
    animation: breathe 4s ease-in-out infinite;
    box-shadow: 0 0 40px rgba(74,74,106,0.25), inset 0 0 30px rgba(0,0,0,0.5);
  }
  body.idle .status-pill { color: var(--idle-color); border-color: rgba(74,74,106,0.4); }

  /* ── State: LISTENING ── */
  body.listening .orb {
    background: radial-gradient(circle at 35% 35%, #0a3a4a, #001a2e);
    box-shadow: 0 0 60px rgba(0,212,255,0.4), 0 0 120px rgba(0,212,255,0.15), inset 0 0 40px rgba(0,100,150,0.3);
    animation: pulse-listen 1s ease-in-out infinite;
  }
  body.listening .ring { color: var(--listen-color); }
  body.listening .ring-1 { opacity: 0.6; animation: expand-ring 1.5s ease-out infinite; }
  body.listening .ring-2 { opacity: 0.3; animation: expand-ring 1.5s ease-out 0.3s infinite; }
  body.listening .ring-3 { opacity: 0.15; animation: expand-ring 1.5s ease-out 0.6s infinite; }
  body.listening .status-pill { color: var(--listen-color); border-color: rgba(0,212,255,0.4); background: rgba(0,212,255,0.08); }
  body.listening .waveform .bar { animation-play-state: running; background: var(--listen-color); }

  /* ── State: THINKING ── */
  body.thinking .orb {
    background: radial-gradient(circle at 35% 35%, #2a0a4a, #120020);
    box-shadow: 0 0 60px rgba(168,85,247,0.5), 0 0 120px rgba(168,85,247,0.2), inset 0 0 40px rgba(100,20,180,0.3);
    animation: spin-orb 2s linear infinite;
  }
  body.thinking .orb::before { opacity: 0.15; color: var(--think-color); animation: spin-shimmer 2s linear infinite; }
  body.thinking .ring { color: var(--think-color); }
  body.thinking .ring-1 { opacity: 0.4; animation: spin-ring 3s linear infinite; }
  body.thinking .ring-2 { opacity: 0.2; animation: spin-ring 4s linear infinite reverse; }
  body.thinking .status-pill { color: var(--think-color); border-color: rgba(168,85,247,0.4); background: rgba(168,85,247,0.08); }

  /* ── State: SPEAKING ── */
  body.speaking .orb {
    background: radial-gradient(circle at 35% 35%, #3a2000, #1a0e00);
    box-shadow: 0 0 60px rgba(245,158,11,0.5), 0 0 120px rgba(245,158,11,0.2), inset 0 0 40px rgba(150,80,0,0.3);
    animation: pulse-speak 0.6s ease-in-out infinite alternate;
  }
  body.speaking .ring { color: var(--speak-color); }
  body.speaking .ring-1 { opacity: 0.5; animation: expand-ring 0.8s ease-out infinite; }
  body.speaking .ring-2 { opacity: 0.25; animation: expand-ring 0.8s ease-out 0.2s infinite; }
  body.speaking .status-pill { color: var(--speak-color); border-color: rgba(245,158,11,0.4); background: rgba(245,158,11,0.08); }
  body.speaking .waveform .bar { animation-play-state: running; background: var(--speak-color); }

  /* ── Waveform bars (bottom of orb) ── */
  .waveform {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 40px;
  }
  .bar {
    width: 4px;
    border-radius: 2px;
    background: var(--idle-color);
    animation: wave 1s ease-in-out infinite alternate paused;
    transform-origin: bottom;
  }
  .bar:nth-child(1)  { height: 8px;  animation-delay: 0.0s; }
  .bar:nth-child(2)  { height: 16px; animation-delay: 0.1s; }
  .bar:nth-child(3)  { height: 24px; animation-delay: 0.2s; }
  .bar:nth-child(4)  { height: 32px; animation-delay: 0.15s; }
  .bar:nth-child(5)  { height: 40px; animation-delay: 0.05s; }
  .bar:nth-child(6)  { height: 32px; animation-delay: 0.25s; }
  .bar:nth-child(7)  { height: 24px; animation-delay: 0.1s; }
  .bar:nth-child(8)  { height: 16px; animation-delay: 0.2s; }
  .bar:nth-child(9)  { height: 8px;  animation-delay: 0.3s; }
  .bar:nth-child(10) { height: 16px; animation-delay: 0.05s; }
  .bar:nth-child(11) { height: 28px; animation-delay: 0.15s; }
  .bar:nth-child(12) { height: 20px; animation-delay: 0.25s; }

  /* ── Text display ── */
  .transcript {
    width: 100%;
    max-width: 640px;
    text-align: center;
  }
  .transcript .user-text {
    font-size: 0.85rem;
    color: var(--text-dim);
    font-family: var(--mono);
    margin-bottom: 0.75rem;
    min-height: 1.2em;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .transcript .user-text.visible { opacity: 1; }
  .transcript .user-text::before { content: '> '; color: var(--listen-color); }

  .transcript .bot-text {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 1rem;
    padding: 1rem 1.5rem;
    min-height: 3em;
    text-align: left;
    backdrop-filter: blur(12px);
    transition: all 0.4s;
    position: relative;
    overflow: hidden;
  }
  .transcript .bot-text::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(245,158,11,0.4), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  body.speaking .transcript .bot-text::before { opacity: 1; }

  /* ── Footer ── */
  footer {
    display: flex;
    justify-content: center;
    gap: 2rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
  }
  .stat {
    text-align: center;
    font-family: var(--mono);
  }
  .stat-val { font-size: 0.9rem; color: var(--text); font-weight: 600; }
  .stat-key { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }

  /* ── Keyframes ── */
  @keyframes breathe {
    0%, 100% { transform: scale(1);    box-shadow: 0 0 40px rgba(74,74,106,0.25); }
    50%       { transform: scale(1.04); box-shadow: 0 0 60px rgba(74,74,106,0.4); }
  }
  @keyframes pulse-listen {
    0%, 100% { transform: scale(1);     }
    50%       { transform: scale(1.06); }
  }
  @keyframes pulse-speak {
    from { transform: scale(1);     }
    to   { transform: scale(1.08); }
  }
  @keyframes spin-orb {
    from { filter: hue-rotate(0deg);   }
    to   { filter: hue-rotate(360deg); }
  }
  @keyframes spin-shimmer {
    from { transform: rotate(0deg);   }
    to   { transform: rotate(360deg); }
  }
  @keyframes expand-ring {
    0%   { transform: scale(1);    opacity: inherit; }
    100% { transform: scale(1.15); opacity: 0; }
  }
  @keyframes spin-ring {
    from { transform: rotate(0deg);   }
    to   { transform: rotate(360deg); }
  }
  @keyframes wave {
    from { transform: scaleY(0.3); }
    to   { transform: scaleY(1.0); }
  }

  /* ── Connection lost overlay ── */
  .disconnected {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(6,6,15,0.85);
    backdrop-filter: blur(8px);
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    z-index: 100;
  }
  .disconnected.show { display: flex; }
</style>
</head>
<body class="idle">

<div class="disconnected" id="disc">CONEXIÓN PERDIDA — RECONECTANDO...</div>

<div class="layout">
  <header>
    <div class="logo">SDD <span>JARVIS</span></div>
    <div class="status-pill" id="pill">EN ESPERA</div>
  </header>

  <div class="center">
    <div class="orb-wrap">
      <div class="ring ring-3"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-1"></div>
      <div class="orb"></div>
    </div>

    <div class="waveform" id="wave">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <div class="transcript">
      <div class="user-text" id="user-text"></div>
      <div class="bot-text" id="bot-text">Sistema listo. Esperando activación...</div>
    </div>
  </div>

  <footer>
    <div class="stat">
      <div class="stat-val" id="stat-project">—</div>
      <div class="stat-key">Proyecto</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-phase">—</div>
      <div class="stat-key">Fase</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-count">0</div>
      <div class="stat-key">Mensajes</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-time">00:00</div>
      <div class="stat-key">Tiempo sesión</div>
    </div>
  </footer>
</div>

<script>
  const LABELS = {
    idle:      'EN ESPERA',
    listening: 'ESCUCHANDO',
    thinking:  'PROCESANDO',
    speaking:  'HABLANDO',
  };

  const pill     = document.getElementById('pill');
  const userEl   = document.getElementById('user-text');
  const botEl    = document.getElementById('bot-text');
  const discEl   = document.getElementById('disc');
  const projEl   = document.getElementById('stat-project');
  const phaseEl  = document.getElementById('stat-phase');
  const countEl  = document.getElementById('stat-count');
  const timeEl   = document.getElementById('stat-time');

  let msgCount  = 0;
  let startTime = Date.now();
  let reconnectTimer = null;

  // ── Timer ──
  setInterval(() => {
    const s = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    timeEl.textContent = `${m}:${sec}`;
  }, 1000);

  // ── State machine ──
  function setState(state, text = '') {
    document.body.className = state;
    pill.textContent = LABELS[state] || state.toUpperCase();

    if (state === 'listening' && text) {
      userEl.textContent = text;
      userEl.classList.add('visible');
    }
    if (state === 'thinking' && text) {
      botEl.textContent = text;
      msgCount++;
      countEl.textContent = msgCount;
    }
    if (state === 'idle') {
      setTimeout(() => userEl.classList.remove('visible'), 2000);
    }
  }

  // ── Fetch session status ──
  async function fetchStatus() {
    try {
      const r = await fetch('/status/jarvis_voice');
      if (!r.ok) return;
      const d = await r.json();
      projEl.textContent  = d.project || '—';
      phaseEl.textContent = (d.phase_label || '—').replace(/^[^\s]+\s/, '');
    } catch (_) {}
  }
  fetchStatus();
  setInterval(fetchStatus, 5000);

  // ── WebSocket connection ──
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws/jarvis`);

    ws.onopen = () => {
      discEl.classList.remove('show');
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    };

    ws.onmessage = (e) => {
      try {
        const { state, text } = JSON.parse(e.data);
        setState(state, text);
      } catch (_) {}
    };

    ws.onclose = () => {
      discEl.classList.add('show');
      reconnectTimer = setTimeout(connect, 2000);
    };

    ws.onerror = () => ws.close();
  }

  connect();
</script>
</body>
</html>
